name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Run unit tests
        shell: pwsh
        run: python -m unittest discover -s tests
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build Windows packages
        shell: pwsh
        run: .\scripts\build_windows.ps1 -Version "${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/*

  macos:
    strategy:
      matrix:
        include:
          - runner: macos-26-intel
            arch: x86_64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Build macOS packages
        run: bash scripts/build_macos.sh "${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-release
          path: release/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analyze and test mobile app
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Build Android APK
        working-directory: mobile
        run: flutter build apk --release
      - name: Prepare Android release asset
        run: |
          mkdir -p release
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "release/YomiPalette-${{ github.ref_name }}-Android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release/*-Android.apk

  publish:
    needs: [windows, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release-assets/* \
            --repo "${{ github.repository }}" \
            --title "YomiPalette ${{ github.ref_name }}" \
            --generate-notes
